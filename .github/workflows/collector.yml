name: Daily & Weekly News Collector

on:
  schedule:
    # UTC 기준 21:00 = 한국 시간(KST) 다음날 오전 6시
    - cron: '0 21 * * *'
  workflow_dispatch: # 버튼을 눌러 언제든 수동으로 실행 가능하게 설정

jobs:
  run-collector:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v3

      - name: 파이썬 환경 설정
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 필요 라이브러리 설치
        run: |
          pip install -r requirements.txt

      - name: 크롤러 및 요약 스크립트 실행
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python main.py
